<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="description" content="Portal kesehatan warga Desa Sehat Kenanga." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <title>Desa Sehat Kenanga — Kesehatan Warga Lebih Dekat</title>
    <style>
      html { background: #f5faf8; }
      #boot { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: radial-gradient(120% 120% at 50% 0%, #eef9f4 0%, #f5faf8 55%, #e3f3ec 100%); transition: opacity .5s ease, visibility .5s ease; }
      #boot.boot-done { opacity: 0; visibility: hidden; pointer-events: none; }
      .boot-inner { display: grid; justify-items: center; gap: 13px; padding: 24px; text-align: center; }
      .boot-logo { position: relative; width: 76px; height: 76px; }
      .boot-logo img { width: 100%; height: 100%; object-fit: cover; border-radius: 20px; border: 1px solid #e3eeeb; background: #fff; box-shadow: 0 18px 40px rgba(25,75,70,.18); animation: boot-beat 1.4s ease-in-out infinite; }
      .boot-ring { position: absolute; inset: -7px; border-radius: 26px; border: 2px solid rgba(15,118,110,.4); animation: boot-ring 1.8s ease-out infinite; }
      .boot-ecg { width: 180px; max-width: 62vw; height: 44px; }
      .boot-ecg polyline { stroke: #0f766e; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 100; stroke-dashoffset: 100; animation: boot-ecg 1.9s linear infinite; }
      .boot-name { font: 800 19px/1.2 'Plus Jakarta Sans', system-ui, sans-serif; color: #183b3b; letter-spacing: -.02em; animation: boot-up .6s ease-out both; }
      .boot-name strong { color: #0f766e; }
      .boot-sub { margin-top: -7px; font: 500 12.5px/1.4 'DM Sans', system-ui, sans-serif; color: #6b8582; animation: boot-up .6s .12s ease-out both; }
      .boot-dots { display: flex; gap: 7px; margin-top: 5px; }
      .boot-dots span { width: 8px; height: 8px; border-radius: 50%; background: #0f766e; animation: boot-dot 1.1s ease-in-out infinite; }
      .boot-dots span:nth-child(2) { animation-delay: .15s; }
      .boot-dots span:nth-child(3) { animation-delay: .3s; }
      @keyframes boot-beat { 0%, 100% { transform: scale(1); } 12% { transform: scale(1.07); } 24% { transform: scale(1); } 36% { transform: scale(1.05); } 48% { transform: scale(1); } }
      @keyframes boot-ring { 0% { transform: scale(.85); opacity: .9; } 70%, 100% { transform: scale(1.5); opacity: 0; } }
      @keyframes boot-ecg { 0% { stroke-dashoffset: 100; } 55% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -100; } }
      @keyframes boot-up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      @keyframes boot-dot { 0%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-4px); } }
      @media (prefers-reduced-motion: reduce) { #boot, #boot * { animation: none !important; transition: none !important; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" aria-hidden="true">
      <div class="boot-inner">
        <div class="boot-logo"><span class="boot-ring"></span><img src="/logo.png" alt="" onerror="this.style.display='none'" /></div>
        <svg class="boot-ecg" viewBox="0 0 180 44" fill="none" aria-hidden="true">
          <polyline pathLength="100" points="2,24 52,24 66,24 76,8 88,38 98,14 106,24 178,24" />
        </svg>
        <div class="boot-name">Desa Sehat <strong>Kenanga</strong></div>
        <div class="boot-sub">Portal kesehatan warga desa</div>
        <div class="boot-dots"><span></span><span></span><span></span></div>
      </div>
    </div>
    <script>setTimeout(function () { var boot = document.getElementById('boot'); if (boot) { boot.classList.add('boot-done'); setTimeout(function () { boot.remove() }, 600) } }, 3800)</script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
